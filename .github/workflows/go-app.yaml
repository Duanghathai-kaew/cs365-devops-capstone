name: CI/CD

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:

  push:
    branches:
      - main
      # - release/**
      # - feat/**
    tags:
      - "v*"
    paths-ignore:
      - "README.md"

  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Application-build:
    name: Go App CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test -v ./...

      - name: Build Go app
        run: go build -v ./...
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: app
          skip-cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t go-port:ci .

      - name: Run container
        run: docker run -d --name go-port-test -p 8080:8080 go-port:ci

      - name: E2E health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/health && curl -f http://localhost:8080/ping; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for app to be ready..."
            sleep 3
          done

          echo "Health check failed"
          docker logs go-port-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f go-port-test

  Backend-build:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build Go backend
        run: go build -v ./...
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: app
          skip-cache: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t go-backend:ci .

      - name: Run container
        run: docker run -d --name go-backend-test -p 8081:8080 go-backend:ci

      - name: Backend health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8081/ping; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 3
          done

          echo "Health check failed"
          docker logs go-backend-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f go-backend-test

  Helm-Validation:
    name: Helm CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - Application-build
      - Backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Select Helm values file
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "VALUES_FILE=values-prod.yaml" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "VALUES_FILE=values-staging.yaml" >> $GITHUB_ENV
          else
            echo "VALUES_FILE=values-dev.yaml" >> $GITHUB_ENV
          fi
      - name: Helm lint
        run: |
          helm lint ./helm/charts \
            -f ./helm/charts/${VALUES_FILE}

      - name: Helm template validate
        run: |
          helm template go-app-platform ./helm/charts \
            -f ./helm/charts/${VALUES_FILE}

  Terraform-CI:
    name: Terraform CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - Application-build
      - Backend-build

    defaults:
      run:
        shell: bash
        working-directory: infra/eks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
          terraform_wrapper: true

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            infra/eks/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/eks/**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -lock=false -var-file=dev.tfvars -input=false

  Docker-Image-Push:
    name: Docker Image Push
    runs-on: ubuntu-latest
    needs:
      - Application-build
      - Helm-Validation
      - Terraform-CI
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-port:${{ github.run_id }}

  Backend-Docker-Push:
    name: Backend Docker Push
    runs-on: ubuntu-latest

    needs:
      - Backend-build
      - Helm-Validation
      - Terraform-CI

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-backend:${{ github.run_id }}

  Image-Scanning:
    name: Image Scanning
    runs-on: ubuntu-latest
    needs:
      - Docker-Image-Push
      - Backend-Docker-Push
    if: github.event_name == 'push'

    steps:
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/go-backend:${{ github.run_id }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan app image
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/go-port:${{ github.run_id }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Updating-helm-tags:
