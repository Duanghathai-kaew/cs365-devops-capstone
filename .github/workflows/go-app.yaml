name: Project CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/**
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io

jobs:

  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Setting Up Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  Code-Quality:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Run golang-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          working-directory: app

  Helm-Validation:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm Lint
        run: helm lint ./helm/charts

      - name: Helm Template Validate
        run: helm template go-portfolio ./helm/charts > /tmp/helm-render.out

  Docker-Image-Push:
    runs-on: ubuntu-latest

    needs:
      - Code-Quality
      - Helm-Validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.5.0

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6.5.0
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-port:${{ github.run_id }}

  Image-Scanning:
    runs-on: ubuntu-latest
    needs: Docker-Image-Push

    steps:

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout
        id: docker-scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/go-port:${{ github.run_id }}
          #to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMPARE_TAG }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  Updating-helm-tags:
    needs: Image-Scanning

    runs-on: ubuntu-latest
    steps:

      - name: Cloning the helm repo
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          owner: "AmanPathak-DevOps"
          repository: "go-app-devops"
          access-token: ${{ secrets.REPO_PAT }}
          branch: "master"

      - name: Updating values in helm
        run: |
          cd go-app-devops
          pwd
          ls -la
          ls -la helm/charts/ || echo "helm/charts not found, checking root:"
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/charts/values.yaml

      - name: Pushing changes
        run: |
          cd go-app-devops
          git config --global user.email "aman07pathak@gmail.com"
          git config --global user.name "AmanPathak-DevOps"
          git add values.yaml
          git commit -am "Updated values.yaml file"
          git push

  Deploy-To-EKS:
    name: Deploy to EKS with Helm
    runs-on: ubuntu-latest
    needs: Updating-helm-tags
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: go-app
      RELEASE_NAME: go-portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Deploy with Helm
        run: |
          set -euo pipefail
          helm upgrade --install "${RELEASE_NAME}" ./helm/charts \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${DOCKER_USERNAME}/go-port" \
            --set image.tag="${GITHUB_RUN_ID}"

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/go-portfolio \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

  Slack-Notification:

    runs-on: ubuntu-latest
    needs:
      [
        build,
        Code-Quality,
        Docker-Image-Push,
        Image-Scanning,
        Updating-helm-tags,
        Deploy-To-EKS,
      ]
    steps:

      - name: Slack Notification
        uses: act10ns/slack@v1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: "#go-app-github-actions"
        if: always()
