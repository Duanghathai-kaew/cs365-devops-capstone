  Deploy-To-EKS:
    name: Deploy to EKS with Helm
    runs-on: ubuntu-latest
    needs: Image-Scanning
    if: github.event_name == 'push'

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: dev-ap-medium-eks-cluster
      # K8S_NAMESPACE: go-app
      # RELEASE_NAME: go-portfolio
      VALUES_FILE: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3

      - name: Terraform Init
        working-directory: infra/eks
        run: terraform init
      # - name: Terraform Apply
      #   working-directory: infra/eks
      #   run: terraform apply -auto-approve -var-file=dev.tfvars

      - name: Set kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Select environment values
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "VALUES_FILE=helm/charts/values-prod.yaml" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=production" >> $GITHUB_ENV
            echo "RELEASE_NAME=go-portfolio-prod" >> $GITHUB_ENV

          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            echo "VALUES_FILE=helm/charts/values-staging.yaml" >> $GITHUB_ENV
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=staging" >> $GITHUB_ENV
            echo "RELEASE_NAME=go-portfolio-staging" >> $GITHUB_ENV

          else
            echo "VALUES_FILE=helm/charts/values-dev.yaml" >> $GITHUB_ENV
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=dev" >> $GITHUB_ENV
            echo "RELEASE_NAME=go-portfolio-dev" >> $GITHUB_ENV
          fi

      - name: Deploy with Helm
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

        run: |
          set -euo pipefail

          helm upgrade --install "${RELEASE_NAME}" ./helm/charts \
            -f "${VALUES_FILE}" \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${DOCKER_USERNAME}/go-port" \
            --set image.tag="${GITHUB_RUN_ID}" \
            --set backendImage.repository="${DOCKER_USERNAME}/go-backend" \
            --set backendImage.tag="${GITHUB_RUN_ID}"
      - name: Verify rollout
        run: |
          set -euo pipefail

          kubectl rollout status deployment/go-portfolio \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

          kubectl rollout status deployment/go-backend \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

