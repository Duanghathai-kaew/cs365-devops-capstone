name: CI/CD

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  application-ci:
    name: Go App CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test -v ./...

      - name: Build Go app
        run: go build -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: app
          skip-cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t go-port:ci .

      - name: Run container
        run: docker run -d --name go-port-test -p 8080:8080 go-port:ci

      - name: E2E health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for app to be ready..."
            sleep 3
          done

          echo "Health check failed"
          docker logs go-port-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f go-port-test

  helm-ci:
    name: Helm CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: application-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm/charts

      - name: Helm template validate
        run: helm template go-portfolio ./helm/charts

  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: application-ci

    defaults:
      run:
        working-directory: infra/eks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  docker-image-push:
    name: Docker Image Push
    runs-on: ubuntu-latest
    needs:
      - application-ci
      - helm-ci
      - terraform-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-port:${{ github.run_id }}

  image-scanning:
    name: Image Scanning
    runs-on: ubuntu-latest
    needs: docker-image-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/go-port:${{ github.run_id }}
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  updating-helm-tags:
    name: Updating Helm Tags
    runs-on: ubuntu-latest
    needs: image-scanning
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Clone same repo
        run: |
          git clone https://${{ secrets.REPO_PAT }}@github.com/Duanghathai-kaew/cs365-devops-capstone.git
          cd cs365-devops-capstone

      - name: Updating values in helm
        run: |
          cd cs365-devops-capstone
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/charts/values.yaml
          echo "Updated helm/charts/values.yaml with tag: ${{ github.run_id }}"

      - name: Pushing changes
        run: |
          cd cs365-devops-capstone
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add helm/charts/values.yaml
          git commit -m "update image tag ${{ github.run_id }} [skip ci]" || echo "no changes"
          git push https://${{ secrets.REPO_PAT }}@github.com/Duanghathai-kaew/cs365-devops-capstone.git HEAD:main

  deploy-to-eks:
    name: Deploy to EKS with Helm
    runs-on: ubuntu-latest
    needs: updating-helm-tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: dev-ap-medium-eks-cluster
      K8S_NAMESPACE: go-app
      RELEASE_NAME: go-portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          set -euo pipefail
          helm upgrade --install "${RELEASE_NAME}" ./helm/charts \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set image.repository="${DOCKER_USERNAME}/go-port" \
            --set image.tag="${GITHUB_RUN_ID}"

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/go-portfolio \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

  slack-notification:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs:
      - application-ci
      - helm-ci
      - terraform-ci
      - docker-image-push
      - image-scanning
      - updating-helm-tags
      - deploy-to-eks
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Slack Notification
        uses: act10ns/slack@v1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: "#go-app-github-actions"