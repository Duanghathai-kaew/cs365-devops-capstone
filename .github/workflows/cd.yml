name: CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: EKS-Terraform-GitHub-Actions/eks
        run: terraform init

      - name: Terraform Apply
        working-directory: EKS-Terraform-GitHub-Actions/eks
        run: terraform apply -auto-approve -var-file=dev.tfvars -input=false

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Login to Docker Registry
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKER_IMAGE_REPO != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKER_IMAGE_REPO != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./go-app
          push: true
          tags: ${{ vars.DOCKER_IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Skip image push when registry is not configured
        if: ${{ !(secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && vars.DOCKER_IMAGE_REPO != '') }}
        run: echo "Docker registry not configured. Skipping image push."
