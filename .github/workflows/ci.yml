name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test, and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go Tests
        working-directory: go-app
        run: go test ./...

      - name: Build Go App
        working-directory: go-app
        run: go build -o app .

      - name: Build Docker Image (immutable local tag)
        working-directory: go-app
        run: docker build -t go-app:${{ github.sha }} .

      - name: Run Container Health Check
        run: |
          docker run -d -p 8080:8080 --name test-app go-app:${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:8080/health
          docker rm -f test-app

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
          terraform_wrapper: true

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        working-directory: EKS-Terraform-GitHub-Actions/eks
        run: terraform init

      - name: Terraform Format Check
        working-directory: EKS-Terraform-GitHub-Actions/eks
        run: terraform fmt -check -diff

      - name: Terraform Validate
        working-directory: EKS-Terraform-GitHub-Actions/eks
        run: terraform validate

      - name: Terraform Plan
        working-directory: EKS-Terraform-GitHub-Actions/eks
        run: terraform plan -var-file=dev.tfvars -input=false -no-color
