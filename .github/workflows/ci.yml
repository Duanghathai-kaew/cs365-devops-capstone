name: Project CI

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feat/**
    paths-ignore:
      - "README.md"

  pull_request:
    branches:
      - main

jobs:
  application-ci:
    name: Go App CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test -v ./...

      - name: Build Go app
        run: go build -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: app
          skip-cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t go-port:ci .

      - name: Run container
        run: |
          docker run -d --name go-port-test -p 8080:8080 go-port:ci

      - name: E2E health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for app to be ready..."
            sleep 3
          done

          echo "Health check failed"
          docker logs go-port-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f go-port-test

  helm-ci:
    name: Helm CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: application-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm/charts

      - name: Helm template validate
        run: helm template go-portfolio ./helm/charts

  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: application-ci

    defaults:
      run:
        working-directory: infra/eks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate