name: "EKS-Creation-Using-Terraform"

on:
  workflow_dispatch:
    inputs:
      tfvars_file:
        description: "Path to the .tfvars file"
        required: true
        default: "dev.tfvars"
      action:
        type: choice
        description: "Terraform Action"
        options:
          - plan
          - apply
          - destroy
        required: true
        default: "plan"

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: EKS-Terraform-GitHub-Actions/eks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
          terraform_wrapper: true

      # Optional: Enable caching to speed up init
      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (skip for demo)
        if: ${{ github.event.inputs.action == 'plan' }}
        run: echo "Skip plan for demo"

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: echo "Skip apply for demo"

      - name: Terraform Destroy (skip for demo)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: echo "Skip destroy for demo"
